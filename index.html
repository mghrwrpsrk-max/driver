<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مدیریت سفرها">
<title>مدیریت سفرها</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
  :root {
    --bg: #0f141f;
    --card: #1c2433;
    --input-bg: #293045;
    --accent: #4085f5;
    --purple: #7c4dff;
    --green: #26ad73;
    --gray: #4d576e;
    --row-a: #242b3d;
    --row-b: #1f2636;
    --white: #ffffff;
    --muted: #9eabbf;
    --red: #ff7373;
    --gold: #ffd159;
    --selected: #8c3847;
    --red-btn: #cc4752;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background-color: var(--bg);
    color: var(--white);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    overflow: hidden;
    direction: rtl;
  }

  /* سرصفحه */
  .header {
    height: 54px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 20px;
    font-weight: bold;
  }
  .header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* کارت‌ها */
  .card {
    background-color: var(--card);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ورودی‌ها */
  input {
    background-color: var(--input-bg);
    border: none;
    outline: none;
    color: var(--white);
    font-size: 15px;
    padding: 10px 12px;
    height: 44px;
    width: 100%;
    border-radius: 8px;
    user-select: text;
    caret-color: var(--accent);
    text-align: right;
  }
  input::placeholder {
    color: var(--muted);
    text-align: right;
  }
  .num-input {
    direction: ltr;
    text-align: right;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .row-inputs {
    display: flex;
    gap: 8px;
  }

  /* دکمه‌ها */
  .btn {
    border: none;
    outline: none;
    border-radius: 12px;
    color: var(--white);
    font-size: 15px;
    font-weight: bold;
    height: 46px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.1s;
  }
  .btn:active {
    filter: brightness(0.75);
  }
  .btn-green { background-color: var(--green); }
  .btn-accent { background-color: var(--accent); }
  .btn-purple { background-color: var(--purple); }
  .btn-gray { background-color: var(--gray); }
  .btn-red { background-color: var(--red-btn); }

  /* بخش جستجو */
  .search-card {
    flex-direction: row;
    height: 68px;
    align-items: center;
    flex-shrink: 0;
  }
  .search-card input { width: 46%; }
  .search-card .btn { width: 27%; height: 44px; font-size: 14px; }

  /* کارت جدول */
  .table-card {
    flex: 1;
    min-height: 0;
    padding: 10px;
    gap: 6px;
  }
  .table-head {
    display: flex;
    height: 28px;
    align-items: center;
    flex-shrink: 0;
  }
  .th {
    color: var(--gold);
    font-size: 13px;
    font-weight: bold;
    text-align: center;
  }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .t-row {
    display: flex;
    align-items: center;
    min-height: 42px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .row-a { background-color: var(--row-a); }
  .row-b { background-color: var(--row-b); }
  .row-selected { background-color: var(--selected) !important; }

  .td {
    text-align: center;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
  }
  .td-num {
    direction: ltr;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .empty-msg {
    color: var(--muted);
    text-align: center;
    height: 44px;
    line-height: 44px;
    font-size: 14px;
  }

  .bottom-actions {
    display: flex;
    gap: 6px;
    height: 44px;
    flex-shrink: 0;
  }
  .bottom-actions .btn {
    height: 44px;
    font-size: 13px;
  }

  /* کارت جمع کل */
  .total-card {
    background-color: var(--input-bg);
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0 10px;
  }
  .total-label {
    font-size: 15px;
    font-weight: bold;
    text-align: center;
  }

  /* پنجره تایید حذف */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .modal-box {
    background-color: var(--card);
    border: 1px solid var(--gray);
    border-radius: 14px;
    width: 85%;
    max-width: 340px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .modal-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--gold);
    border-bottom: 1px solid var(--gray);
    padding-bottom: 8px;
  }
  .modal-text {
    font-size: 15px;
    text-align: center;
    padding: 8px 0;
  }
  .modal-buttons {
    display: flex;
    gap: 10px;
  }
  .modal-buttons .btn {
    flex: 1;
    height: 44px;
  }
</style>
</head>
<body>

  <!-- عنوان -->
  <div class="header">
    <h1>مدیریت سفرهای راننده</h1>
    <p id="countLabel">مجموع سفرها: 0</p>
  </div>

  <!-- کارت ثبت سفر -->
  <div class="card" style="flex-shrink: 0;">
    <input type="text" id="nameInput" placeholder="نام راننده">
    <div class="row-inputs">
      <input type="text" id="dateInput" class="num-input" inputmode="numeric" placeholder="تاریخ (مثلا 1405/08/23)" style="width: 52%;">
      <input type="text" id="invoiceInput" class="num-input" placeholder="شماره فاکتور" style="width: 48%;">
    </div>
    <input type="text" id="costInput" class="num-input" inputmode="numeric" placeholder="هزینه ارسال (کرایه)">
    <button class="btn btn-green" onclick="addTrip()">ثبت سفر</button>
  </div>

  <!-- کارت جستجو -->
  <div class="card search-card">
    <input type="text" id="searchInput" class="num-input" inputmode="numeric" placeholder="تاریخ جستجو">
    <button class="btn btn-accent" onclick="searchDate()">جستجو</button>
    <button class="btn btn-gray" onclick="showAll()">نمایش همه</button>
  </div>

  <!-- کارت جدول -->
  <div class="card table-card">
    <div class="table-head" id="tableHead"></div>
    <div class="scroll-area" id="rowsContainer"></div>
    <div class="bottom-actions">
      <button class="btn btn-accent" style="width: 30%;" onclick="showDaily()">جمع روزانه</button>
      <button class="btn btn-purple" style="width: 34%;" onclick="exportToNotes()">خروجی به نوت</button>
      <button class="btn btn-red" id="deleteBtn" style="width: 36%;" onclick="askDelete()">حذف انتخاب‌شده</button>
    </div>
  </div>

  <!-- کارت جمع هزینه -->
  <div class="total-card">
    <span class="total-label" id="totalLabel">همه سفرها</span>
  </div>

  <!-- پاپ‌آپ تایید حذف -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <div class="modal-title">تأیید حذف</div>
      <div class="modal-text" id="confirmText">آیا سفرهای انتخاب‌شده حذف شوند؟</div>
      <div class="modal-buttons">
        <button class="btn btn-gray" onclick="closeModal()">انصراف</button>
        <button class="btn btn-red" onclick="deleteSelected()">حذف</button>
      </div>
    </div>
  </div>

<script>
  const THOUSAND_SEP = ",";
  const DIGITS_MAP = {
    '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9',
    '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'
  };

  function toEnglishDigits(str) {
    return String(str).replace(/[۰-۹٠-٩]/g, d => DIGITS_MAP[d]);
  }

  function normDate(text) {
    return toEnglishDigits(text).trim().replace(/-/g, "/");
  }

  function money(n) {
    return Number(n).toLocaleString('en-US').replace(/,/g, THOUSAND_SEP);
  }

  function setupDateInput(el) {
    el.addEventListener('input', function() {
      let raw = toEnglishDigits(this.value);
      let digits = raw.replace(/[^0-9]/g, '').slice(0, 8);
      let formatted = digits.slice(0, 4);
      if (digits.length > 4) formatted += '/' + digits.slice(4, 6);
      if (digits.length > 6) formatted += '/' + digits.slice(6, 8);
      this.value = formatted;
    });
  }

  function setupMoneyInput(el) {
    el.addEventListener('input', function() {
      let raw = toEnglishDigits(this.value);
      let digits = raw.replace(/[^0-9]/g, '').slice(0, 12);
      this.value = digits === "" ? "" : money(parseInt(digits, 10));
    });
  }

  setupDateInput(document.getElementById('dateInput'));
  setupDateInput(document.getElementById('searchInput'));
  setupMoneyInput(document.getElementById('costInput'));

  // تبدیل خودکار اعداد فارسی در شماره فاکتور به انگلیسی
  document.getElementById('invoiceInput').addEventListener('input', function() {
    this.value = toEnglishDigits(this.value);
  });

  let trips = [];
  let selectedIndices = new Set();
  let viewDate = null;
  let currentMode = 'trips'; // 'trips' یا 'daily'

  function loadTrips() {
    try {
      const data = localStorage.getItem('driver_trips_data');
      if (data) trips = JSON.parse(data);
    } catch (e) {
      trips = [];
    }
  }

  function saveTrips() {
    try {
      localStorage.setItem('driver_trips_data', JSON.stringify(trips));
      return true;
    } catch (e) {
      return false;
    }
  }

  function updateCount() {
    document.getElementById('countLabel').textContent = "مجموع سفرها: " + trips.length;
  }

  function setMessage(text, isError = false) {
    const lbl = document.getElementById('totalLabel');
    lbl.textContent = text;
    lbl.style.color = isError ? 'var(--red)' : 'var(--white)';
  }

  function setHeader(cols) {
    const head = document.getElementById('tableHead');
    head.innerHTML = '';
    cols.forEach(([title, weight]) => {
      const div = document.createElement('div');
      div.className = 'th';
      div.style.width = (weight * 100) + '%';
      div.textContent = title;
      head.appendChild(div);
    });
  }

  function updateDeleteButton() {
    const n = selectedIndices.size;
    const btn = document.getElementById('deleteBtn');
    btn.textContent = n === 0 ? "حذف انتخاب‌شده" : `حذف (${n})`;
  }

  const TRIP_COLS = [["راننده", 0.28], ["تاریخ", 0.26], ["فاکتور", 0.22], ["هزینه", 0.24]];
  const DAY_COLS = [["تاریخ", 0.36], ["تعداد سفر", 0.22], ["جمع کل", 0.42]];

  function showTable(items) {
    currentMode = 'trips';
    const container = document.getElementById('rowsContainer');
    container.innerHTML = '';
    selectedIndices.clear();
    updateDeleteButton();
    setHeader(TRIP_COLS);

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = "موردی برای نمایش وجود ندارد";
      container.appendChild(empty);
      return;
    }

    items.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 't-row ' + (i % 2 === 0 ? 'row-a' : 'row-b');
      row.innerHTML = `
        <div class="td" style="width:28%; font-size:14px; color:var(--white);">${item.trip.name}</div>
        <div class="td td-num" style="width:26%; color:var(--muted);">${toEnglishDigits(item.trip.date)}</div>
        <div class="td td-num" style="width:22%; color:var(--muted);">${toEnglishDigits(item.trip.invoice || '')}</div>
        <div class="td td-num" style="width:24%; color:var(--green); font-weight:bold;">${money(item.trip.cost)}</div>
      `;
      row.onclick = () => {
        if (selectedIndices.has(item.originalIndex)) {
          selectedIndices.delete(item.originalIndex);
          row.classList.remove('row-selected');
        } else {
          selectedIndices.add(item.originalIndex);
          row.classList.add('row-selected');
        }
        updateDeleteButton();
      };
      container.appendChild(row);
    });
  }

  function showDaily() {
    currentMode = 'daily';
    const days = {};
    trips.forEach(t => {
      const d = normDate(t.date);
      if (!days[d]) days[d] = [0, 0];
      days[d][0] += 1;
      days[d][1] += t.cost;
    });

    viewDate = null;
    const container = document.getElementById('rowsContainer');
    container.innerHTML = '';
    selectedIndices.clear();
    updateDeleteButton();
    setHeader(DAY_COLS);

    const sortedDates = Object.keys(days).sort().reverse();
    if (sortedDates.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = "موردی برای نمایش وجود ندارد";
      container.appendChild(empty);
      setMessage("هنوز سفری ثبت نشده است", true);
      return;
    }

    let grand = 0;
    sortedDates.forEach((d, i) => {
      const [count, total] = days[d];
      grand += total;
      const row = document.createElement('div');
      row.className = 't-row ' + (i % 2 === 0 ? 'row-a' : 'row-b');
      row.innerHTML = `
        <div class="td td-num" style="width:36%; color:var(--muted);">${d}</div>
        <div class="td td-num" style="width:22%; font-size:14px; color:var(--white);">${count}</div>
        <div class="td td-num" style="width:42%; font-size:14px; color:var(--green); font-weight:bold;">${money(total)}</div>
      `;
      row.onclick = () => {
        document.getElementById('searchInput').value = d;
        showDate(d);
      };
      container.appendChild(row);
    });

    setMessage(`جمع کل همه روزها: ${money(grand)} (${sortedDates.length} روز)`);
  }

  function addTrip() {
    const name = document.getElementById('nameInput').value.trim();
    const date = normDate(document.getElementById('dateInput').value);
    const invoice = toEnglishDigits(document.getElementById('invoiceInput').value.trim());
    const costText = toEnglishDigits(document.getElementById('costInput').value).replace(/,/g, '').trim();

    if (!name || !date || !invoice || !costText) {
      setMessage("لطفاً تمام فیلدها را پر کنید", true);
      return;
    }
    if (date.length !== 10) {
      setMessage("فرمت تاریخ باید مثل 1405/08/23 باشد", true);
      return;
    }

    trips.push({
      name: name,
      date: date,
      invoice: invoice,
      cost: parseInt(costText, 10)
    });

    if (!saveTrips()) {
      setMessage("خطا در ذخیره‌سازی اطلاعات", true);
      return;
    }

    updateCount();
    document.getElementById('invoiceInput').value = '';
    document.getElementById('costInput').value = '';

    document.getElementById('searchInput').value = date;
    searchDate();
  }

  function searchDate() {
    const date = normDate(document.getElementById('searchInput').value);
    if (!date) {
      setMessage("لطفاً یک تاریخ وارد کنید", true);
      return;
    }
    showDate(date);
  }

  function showDate(date) {
    viewDate = date;
    const found = [];
    let total = 0;
    trips.forEach((t, idx) => {
      if (normDate(t.date) === date) {
        found.push({ trip: t, originalIndex: idx });
        total += t.cost;
      }
    });

    showTable(found);
    if (found.length === 0) {
      setMessage("سفری در این تاریخ یافت نشد", true);
    } else {
      setMessage("جمع هزینه: " + money(total));
    }
  }

  function showAll() {
    viewDate = null;
    const allItems = trips.map((t, idx) => ({ trip: t, originalIndex: idx }));
    showTable(allItems);
    const total = trips.reduce((sum, t) => sum + t.cost, 0);
    setMessage(trips.length > 0 ? "همه سفرها | جمع کل: " + money(total) : "همه سفرها");
  }

  function askDelete() {
    const n = selectedIndices.size;
    if (n === 0) {
      setMessage("ابتدا روی یک ردیف بزنید تا انتخاب شود", true);
      return;
    }
    document.getElementById('confirmText').textContent = `آیا ${n} سفر انتخاب‌شده حذف شود؟`;
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('confirmModal').style.display = 'none';
  }

  function deleteSelected() {
    const count = selectedIndices.size;
    trips = trips.filter((_, idx) => !selectedIndices.has(idx));
    closeModal();

    const saved = saveTrips();
    updateCount();

    if (viewDate === null) {
      showAll();
    } else {
      showDate(viewDate);
    }

    if (saved) {
      setMessage(`${count} سفر حذف شد`);
    } else {
      setMessage("خطا در ذخیره‌سازی اطلاعات", true);
    }
  }

  // خروجی گرفتن برای برنامه Notes آیفون
  async function exportToNotes() {
    if (trips.length === 0) {
      setMessage("اطلاعاتی برای خروجی گرفتن وجود ندارد", true);
      return;
    }

    let text = "";

    if (currentMode === 'daily') {
      const days = {};
      trips.forEach(t => {
        const d = normDate(t.date);
        if (!days[d]) days[d] = [0, 0];
        days[d][0] += 1;
        days[d][1] += t.cost;
      });
      const sortedDates = Object.keys(days).sort().reverse();
      let grand = 0;
      text += "📊 گزارش جمع روزانه سفرها\n";
      text += "━━━━━━━━━━━━━━━\n";
      sortedDates.forEach(d => {
        const [count, total] = days[d];
        grand += total;
        text += `📅 تاریخ: ${d} | تعداد: ${count} سفر | جمع: ${money(total)}\n`;
      });
      text += "━━━━━━━━━━━━━━━\n";
      text += `💰 جمع کل همه روزها: ${money(grand)} (${sortedDates.length} روز)`;
    } else {
      let listToExport = [];
      let title = "";

      if (selectedIndices.size > 0) {
        listToExport = trips.filter((_, idx) => selectedIndices.has(idx));
        title = `📋 گزارش سفرهای انتخاب‌شده (${listToExport.length} مورد)`;
      } else if (viewDate !== null) {
        listToExport = trips.filter(t => normDate(t.date) === viewDate);
        title = `📋 گزارش سفرهای تاریخ ${viewDate}`;
      } else {
        listToExport = trips;
        title = `📋 گزارش کل سفرها (${listToExport.length} مورد)`;
      }

      if (listToExport.length === 0) {
        setMessage("موردی برای خروجی گرفتن وجود ندارد", true);
        return;
      }

      let total = 0;
      text += title + "\n";
      text += "━━━━━━━━━━━━━━━\n";
      listToExport.forEach((t, i) => {
        total += t.cost;
        text += `${i + 1}. راننده: ${t.name} | تاریخ: ${normDate(t.date)} | فاکتور: ${toEnglishDigits(t.invoice)} | هزینه: ${money(t.cost)}\n`;
      });
      text += "━━━━━━━━━━━━━━━\n";
      text += `💰 جمع کل هزینه: ${money(total)}`;
    }

    // باز کردن منوی اشتراک‌گذاری آیفون برای ارسال مستقیم به Notes
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'گزارش سفرها',
          text: text
        });
        setMessage("گزارش آماده ذخیره در نوت شد");
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }

    // در صورت بسته بودن اشتراک‌گذاری، کپی در کلیپ‌بورد گوشی
    try {
      await navigator.clipboard.writeText(text);
      setMessage("متن گزارش کپی شد؛ در برنامه نوت Paste کنید");
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setMessage("متن گزارش کپی شد؛ در برنامه نوت Paste کنید");
    }
  }

  // راه‌اندازی اولیه
  loadTrips();
  updateCount();
  showAll();
</script>
</body>
</html>
