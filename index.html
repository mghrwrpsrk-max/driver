<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مدیریت سفرها">
<title>مدیریت سفرها</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
  :root {
    --bg: #0f141f;
    --card: #1c2433;
    --input-bg: #293045;
    --accent: #4085f5;
    --purple: #7c4dff;
    --green: #26ad73;
    --gray: #4d576e;
    --row-a: #242b3d;
    --row-b: #1f2636;
    --white: #ffffff;
    --muted: #9eabbf;
    --red: #ff7373;
    --gold: #ffd159;
    --selected: #8c3847;
    --red-btn: #cc4752;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background-color: var(--bg);
    color: var(--white);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 10px 12px;
    gap: 8px;
    overflow: hidden;
    direction: rtl;
  }

  /* سرصفحه و دکمه بیشتر */
  .header {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header-titles {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }
  .header h1 {
    font-size: 19px;
    font-weight: bold;
  }
  .header p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .more-btn {
    background-color: var(--input-bg);
    border: 1px solid var(--accent);
    color: var(--white);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    height: 38px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .more-btn:active {
    filter: brightness(0.75);
  }

  /* کارت‌ها */
  .card {
    background-color: var(--card);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  /* ورودی‌ها */
  input {
    background-color: var(--input-bg);
    border: none;
    outline: none;
    color: var(--white);
    font-size: 14px;
    padding: 8px 12px;
    height: 40px;
    width: 100%;
    border-radius: 8px;
    user-select: text;
    caret-color: var(--accent);
    text-align: right;
  }
  input::placeholder {
    color: var(--muted);
    text-align: right;
  }
  .num-input {
    direction: ltr;
    text-align: right;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .row-inputs {
    display: flex;
    gap: 8px;
  }

  /* انتخاب‌گر سه گزینه‌ای (اسنپ / سایت / مغازه) */
  .source-selector {
    display: flex;
    background-color: var(--input-bg);
    border-radius: 10px;
    padding: 4px;
    gap: 4px;
    height: 40px;
  }
  .source-opt {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: bold;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .source-opt.active {
    background-color: var(--accent);
    color: var(--white);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }

  /* دکمه‌ها */
  .btn {
    border: none;
    outline: none;
    border-radius: 11px;
    color: var(--white);
    font-size: 15px;
    font-weight: bold;
    height: 42px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.1s;
  }
  .btn:active {
    filter: brightness(0.75);
  }
  .btn-green { background-color: var(--green); }
  .btn-accent { background-color: var(--accent); }
  .btn-purple { background-color: var(--purple); }
  .btn-gray { background-color: var(--gray); }
  .btn-red { background-color: var(--red-btn); }

  /* بخش جستجو */
  .search-card {
    flex-direction: row;
    height: 60px;
    align-items: center;
    flex-shrink: 0;
  }
  .search-card input { width: 46%; height: 40px; }
  .search-card .btn { width: 27%; height: 40px; font-size: 13px; }

  /* کارت جدول */
  .table-card {
    flex: 1;
    min-height: 0;
    padding: 10px;
    gap: 6px;
  }
  .table-head {
    display: flex;
    height: 26px;
    align-items: center;
    flex-shrink: 0;
  }
  .th {
    color: var(--gold);
    font-size: 12px;
    font-weight: bold;
    text-align: center;
  }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .t-row {
    display: flex;
    align-items: center;
    min-height: 40px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .row-a { background-color: var(--row-a); }
  .row-b { background-color: var(--row-b); }
  .row-selected { background-color: var(--selected) !important; }

  .td {
    text-align: center;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 3px;
  }
  .td-num {
    direction: ltr;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .badge-type {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
  }
  .badge-snapp { background: rgba(38, 173, 115, 0.2); color: #4ade80; }
  .badge-site { background: rgba(64, 133, 245, 0.2); color: #60a5fa; }
  .badge-shop { background: rgba(255, 209, 89, 0.2); color: #fcd34d; }

  .empty-msg {
    color: var(--muted);
    text-align: center;
    height: 44px;
    line-height: 44px;
    font-size: 14px;
  }

  .bottom-actions {
    display: flex;
    gap: 6px;
    height: 42px;
    flex-shrink: 0;
  }
  .bottom-actions .btn {
    height: 42px;
    font-size: 13px;
  }

  /* کارت جمع کل */
  .total-card {
    background-color: var(--input-bg);
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0 10px;
  }
  .total-label {
    font-size: 14px;
    font-weight: bold;
    text-align: center;
  }

  /* مودال‌ها (حذف و جمع ماهانه) */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 16px;
  }
  .modal-box {
    background-color: var(--card);
    border: 1px solid var(--gray);
    border-radius: 16px;
    width: 100%;
    max-width: 370px;
    max-height: 82dvh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .modal-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--gold);
    border-bottom: 1px solid var(--gray);
    padding-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-text {
    font-size: 15px;
    text-align: center;
    padding: 8px 0;
  }
  .modal-buttons {
    display: flex;
    gap: 10px;
  }
  .modal-buttons .btn {
    flex: 1;
    height: 42px;
  }

  /* لیست جمع ماهانه در مودال بیشتر */
  .monthly-list {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 55dvh;
    padding-left: 2px;
  }
  .month-card {
    background-color: var(--row-a);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-right: 3px solid var(--accent);
  }
  .month-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .month-name {
    font-size: 14px;
    font-weight: bold;
    color: var(--white);
  }
  .month-total {
    font-size: 15px;
    font-weight: bold;
    color: var(--green);
  }
  .month-sub {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 5px;
  }
</style>
</head>
<body>

  <!-- سرصفحه به همراه دکمه بیشتر -->
  <div class="header">
    <button class="more-btn" onclick="openMoreModal()">☰ بیشتر</button>
    <div class="header-titles">
      <h1>مدیریت سفرهای راننده</h1>
      <p id="countLabel">مجموع سفرها: 0</p>
    </div>
    <div style="width: 68px;"></div>
  </div>

  <!-- کارت ثبت سفر -->
  <div class="card" style="flex-shrink: 0;">
    <input type="text" id="nameInput" placeholder="نام راننده">
    <div class="row-inputs">
      <input type="text" id="dateInput" class="num-input" inputmode="numeric" placeholder="تاریخ (1405/08/23)" style="width: 52%;">
      <input type="text" id="invoiceInput" class="num-input" placeholder="شماره فاکتور" style="width: 48%;">
    </div>

    <!-- انتخاب نوع: اسنپ / سایت / مغازه -->
    <div class="source-selector">
      <button type="button" class="source-opt active" onclick="selectSource('اسنپ', this)">اسنپ</button>
      <button type="button" class="source-opt" onclick="selectSource('سایت', this)">سایت</button>
      <button type="button" class="source-opt" onclick="selectSource('مغازه', this)">مغازه</button>
    </div>

    <input type="text" id="costInput" class="num-input" inputmode="numeric" placeholder="هزینه ارسال (کرایه)">
    <button class="btn btn-green" onclick="addTrip()">ثبت سفر</button>
  </div>

  <!-- کارت جستجو -->
  <div class="card search-card">
    <input type="text" id="searchInput" class="num-input" inputmode="numeric" placeholder="تاریخ جستجو">
    <button class="btn btn-accent" onclick="searchDate()">جستجو</button>
    <button class="btn btn-gray" onclick="showAll()">نمایش همه</button>
  </div>

  <!-- کارت جدول -->
  <div class="card table-card">
    <div class="table-head" id="tableHead"></div>
    <div class="scroll-area" id="rowsContainer"></div>
    <div class="bottom-actions">
      <button class="btn btn-accent" style="width: 30%;" onclick="showDaily()">جمع روزانه</button>
      <button class="btn btn-purple" style="width: 34%;" onclick="exportToNotes()">خروجی به نوت</button>
      <button class="btn btn-red" id="deleteBtn" style="width: 36%;" onclick="askDelete()">حذف انتخاب‌شده</button>
    </div>
  </div>

  <!-- کارت جمع هزینه -->
  <div class="total-card">
    <span class="total-label" id="totalLabel">همه سفرها</span>
  </div>

  <!-- پنجره تایید حذف -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
      <div class="modal-title">تأیید حذف</div>
      <div class="modal-text" id="confirmText">آیا سفرهای انتخاب‌شده حذف شوند؟</div>
      <div class="modal-buttons">
        <button class="btn btn-gray" onclick="closeModal()">انصراف</button>
        <button class="btn btn-red" onclick="deleteSelected()">حذف</button>
      </div>
    </div>
  </div>

  <!-- پنجره بیشتر (آمار و جمع ماهانه) -->
  <div class="modal-overlay" id="moreModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>📊 گزارش و جمع ماهانه</span>
      </div>
      <div class="monthly-list" id="monthlyContainer"></div>
      <div class="modal-buttons">
        <button class="btn btn-purple" onclick="exportMonthlyToNotes()">خروجی ماهانه به نوت</button>
        <button class="btn btn-gray" onclick="closeMoreModal()">بستن</button>
      </div>
    </div>
  </div>

<script>
  const THOUSAND_SEP = ",";
  const DIGITS_MAP = {
    '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9',
    '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'
  };

  const PERSIAN_MONTHS = {
    "01": "فروردین", "02": "اردیبهشت", "03": "خرداد",
    "04": "تیر", "05": "مرداد", "06": "شهریور",
    "07": "مهر", "08": "آبان", "09": "آذر",
    "10": "دی", "11": "بهمن", "12": "اسفند"
  };

  let currentSource = "اسنپ";

  function selectSource(val, btnEl) {
    currentSource = val;
    document.querySelectorAll('.source-opt').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
  }

  function toEnglishDigits(str) {
    return String(str).replace(/[۰-۹٠-٩]/g, d => DIGITS_MAP[d]);
  }

  function normDate(text) {
    return toEnglishDigits(text).trim().replace(/-/g, "/");
  }

  function money(n) {
    return Number(n).toLocaleString('en-US').replace(/,/g, THOUSAND_SEP);
  }

  function getMonthLabel(ym) {
    const parts = ym.split('/');
    if (parts.length === 2 && PERSIAN_MONTHS[parts[1]]) {
      return `${PERSIAN_MONTHS[parts[1]]} ${parts[0]}`;
    }
    return ym;
  }

  function getBadgeClass(source) {
    if (source === 'سایت') return 'badge-site';
    if (source === 'مغازه') return 'badge-shop';
    return 'badge-snapp';
  }

  function setupDateInput(el) {
    el.addEventListener('input', function() {
      let raw = toEnglishDigits(this.value);
      let digits = raw.replace(/[^0-9]/g, '').slice(0, 8);
      let formatted = digits.slice(0, 4);
      if (digits.length > 4) formatted += '/' + digits.slice(4, 6);
      if (digits.length > 6) formatted += '/' + digits.slice(6, 8);
      this.value = formatted;
    });
  }

  function setupMoneyInput(el) {
    el.addEventListener('input', function() {
      let raw = toEnglishDigits(this.value);
      let digits = raw.replace(/[^0-9]/g, '').slice(0, 12);
      this.value = digits === "" ? "" : money(parseInt(digits, 10));
    });
  }

  setupDateInput(document.getElementById('dateInput'));
  setupDateInput(document.getElementById('searchInput'));
  setupMoneyInput(document.getElementById('costInput'));

  document.getElementById('invoiceInput').addEventListener('input', function() {
    this.value = toEnglishDigits(this.value);
  });

  let trips = [];
  let selectedIndices = new Set();
  let viewDate = null;
  let currentMode = 'trips';

  function loadTrips() {
    try {
      const data = localStorage.getItem('driver_trips_data');
      if (data) trips = JSON.parse(data);
    } catch (e) {
      trips = [];
    }
  }

  function saveTrips() {
    try {
      localStorage.setItem('driver_trips_data', JSON.stringify(trips));
      return true;
    } catch (e) {
      return false;
    }
  }

  function updateCount() {
    document.getElementById('countLabel').textContent = "مجموع سفرها: " + trips.length;
  }

  function setMessage(text, isError = false) {
    const lbl = document.getElementById('totalLabel');
    lbl.textContent = text;
    lbl.style.color = isError ? 'var(--red)' : 'var(--white)';
  }

  function setHeader(cols) {
    const head = document.getElementById('tableHead');
    head.innerHTML = '';
    cols.forEach(([title, weight]) => {
      const div = document.createElement('div');
      div.className = 'th';
      div.style.width = (weight * 100) + '%';
      div.textContent = title;
      head.appendChild(div);
    });
  }

  function updateDeleteButton() {
    const n = selectedIndices.size;
    const btn = document.getElementById('deleteBtn');
    btn.textContent = n === 0 ? "حذف انتخاب‌شده" : `حذف (${n})`;
  }

  const TRIP_COLS = [
    ["راننده", 0.22],
    ["نوع", 0.16],
    ["تاریخ", 0.24],
    ["فاکتور", 0.16],
    ["هزینه", 0.22]
  ];
  const DAY_COLS = [["تاریخ", 0.36], ["تعداد سفر", 0.22], ["جمع کل", 0.42]];

  function showTable(items) {
    currentMode = 'trips';
    const container = document.getElementById('rowsContainer');
    container.innerHTML = '';
    selectedIndices.clear();
    updateDeleteButton();
    setHeader(TRIP_COLS);

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = "موردی برای نمایش وجود ندارد";
      container.appendChild(empty);
      return;
    }

    items.forEach((item, i) => {
      const src = item.trip.source || 'اسنپ';
      const row = document.createElement('div');
      row.className = 't-row ' + (i % 2 === 0 ? 'row-a' : 'row-b');
      row.innerHTML = `
        <div class="td" style="width:22%; color:var(--white);">${item.trip.name}</div>
        <div class="td" style="width:16%;"><span class="badge-type ${getBadgeClass(src)}">${src}</span></div>
        <div class="td td-num" style="width:24%; color:var(--muted);">${toEnglishDigits(item.trip.date)}</div>
        <div class="td td-num" style="width:16%; color:var(--muted);">${toEnglishDigits(item.trip.invoice || '')}</div>
        <div class="td td-num" style="width:22%; color:var(--green); font-weight:bold;">${money(item.trip.cost)}</div>
      `;
      row.onclick = () => {
        if (selectedIndices.has(item.originalIndex)) {
          selectedIndices.delete(item.originalIndex);
          row.classList.remove('row-selected');
        } else {
          selectedIndices.add(item.originalIndex);
          row.classList.add('row-selected');
        }
        updateDeleteButton();
      };
      container.appendChild(row);
    });
  }

  function showDaily() {
    currentMode = 'daily';
    const days = {};
    trips.forEach(t => {
      const d = normDate(t.date);
      if (!days[d]) days[d] = [0, 0];
      days[d][0] += 1;
      days[d][1] += t.cost;
    });

    viewDate = null;
    const container = document.getElementById('rowsContainer');
    container.innerHTML = '';
    selectedIndices.clear();
    updateDeleteButton();
    setHeader(DAY_COLS);

    const sortedDates = Object.keys(days).sort().reverse();
    if (sortedDates.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = "موردی برای نمایش وجود ندارد";
      container.appendChild(empty);
      setMessage("هنوز سفری ثبت نشده است", true);
      return;
    }

    let grand = 0;
    sortedDates.forEach((d, i) => {
      const [count, total] = days[d];
      grand += total;
      const row = document.createElement('div');
      row.className = 't-row ' + (i % 2 === 0 ? 'row-a' : 'row-b');
      row.innerHTML = `
        <div class="td td-num" style="width:36%; color:var(--muted);">${d}</div>
        <div class="td td-num" style="width:22%; font-size:14px; color:var(--white);">${count}</div>
        <div class="td td-num" style="width:42%; font-size:14px; color:var(--green); font-weight:bold;">${money(total)}</div>
      `;
      row.onclick = () => {
        document.getElementById('searchInput').value = d;
        showDate(d);
      };
      container.appendChild(row);
    });

    setMessage(`جمع کل همه روزها: ${money(grand)} (${sortedDates.length} روز)`);
  }

  // محاسبه و نمایش جمع ماهانه در منوی بیشتر
  function getMonthlyData() {
    const months = {};
    trips.forEach(t => {
      const d = normDate(t.date);
      const ym = d.length >= 7 ? d.slice(0, 7) : "نامشخص";
      const src = t.source || "اسنپ";
      if (!months[ym]) {
        months[ym] = { count: 0, total: 0, snapp: 0, site: 0, shop: 0 };
      }
      months[ym].count += 1;
      months[ym].total += t.cost;
      if (src === "اسنپ") months[ym].snapp += t.cost;
      else if (src === "سایت") months[ym].site += t.cost;
      else if (src === "مغازه") months[ym].shop += t.cost;
    });
    return months;
  }

  function openMoreModal() {
    const container = document.getElementById('monthlyContainer');
    container.innerHTML = '';
    const months = getMonthlyData();
    const sortedMonths = Object.keys(months).sort().reverse();

    if (sortedMonths.length === 0) {
      container.innerHTML = '<div class="empty-msg">هنوز سفری ثبت نشده است</div>';
    } else {
      sortedMonths.forEach(ym => {
        const m = months[ym];
        const card = document.createElement('div');
        card.className = 'month-card';
        card.innerHTML = `
          <div class="month-top">
            <span class="month-name">${getMonthLabel(ym)} <span style="color:var(--muted); font-size:12px;">(${m.count} سفر)</span></span>
            <span class="month-total td-num">${money(m.total)}</span>
          </div>
          <div class="month-sub">
            <span>اسنپ: <b class="td-num" style="color:#4ade80;">${money(m.snapp)}</b></span>
            <span>سایت: <b class="td-num" style="color:#60a5fa;">${money(m.site)}</b></span>
            <span>مغازه: <b class="td-num" style="color:#fcd34d;">${money(m.shop)}</b></span>
          </div>
        `;
        container.appendChild(card);
      });
    }
    document.getElementById('moreModal').style.display = 'flex';
  }

  function closeMoreModal() {
    document.getElementById('moreModal').style.display = 'none';
  }

  function addTrip() {
    const name = document.getElementById('nameInput').value.trim();
    const date = normDate(document.getElementById('dateInput').value);
    const invoice = toEnglishDigits(document.getElementById('invoiceInput').value.trim());
    const costText = toEnglishDigits(document.getElementById('costInput').value).replace(/,/g, '').trim();

    if (!name || !date || !invoice || !costText) {
      setMessage("لطفاً تمام فیلدها را پر کنید", true);
      return;
    }
    if (date.length !== 10) {
      setMessage("فرمت تاریخ باید مثل 1405/08/23 باشد", true);
      return;
    }

    trips.push({
      name: name,
      source: currentSource,
      date: date,
      invoice: invoice,
      cost: parseInt(costText, 10)
    });

    if (!saveTrips()) {
      setMessage("خطا در ذخیره‌سازی اطلاعات", true);
      return;
    }

    updateCount();
    document.getElementById('invoiceInput').value = '';
    document.getElementById('costInput').value = '';

    document.getElementById('searchInput').value = date;
    searchDate();
  }

  function searchDate() {
    const date = normDate(document.getElementById('searchInput').value);
    if (!date) {
      setMessage("لطفاً یک تاریخ وارد کنید", true);
      return;
    }
    showDate(date);
  }

  function showDate(date) {
    viewDate = date;
    const found = [];
    let total = 0;
    trips.forEach((t, idx) => {
      if (normDate(t.date) === date) {
        found.push({ trip: t, originalIndex: idx });
        total += t.cost;
      }
    });

    showTable(found);
    if (found.length === 0) {
      setMessage("سفری در این تاریخ یافت نشد", true);
    } else {
      setMessage("جمع هزینه: " + money(total));
    }
  }

  function showAll() {
    viewDate = null;
    const allItems = trips.map((t, idx) => ({ trip: t, originalIndex: idx }));
    showTable(allItems);
    const total = trips.reduce((sum, t) => sum + t.cost, 0);
    setMessage(trips.length > 0 ? "همه سفرها | جمع کل: " + money(total) : "همه سفرها");
  }

  function askDelete() {
    const n = selectedIndices.size;
    if (n === 0) {
      setMessage("ابتدا روی یک ردیف بزنید تا انتخاب شود", true);
      return;
    }
    document.getElementById('confirmText').textContent = `آیا ${n} سفر انتخاب‌شده حذف شود؟`;
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('confirmModal').style.display = 'none';
  }

  function deleteSelected() {
    const count = selectedIndices.size;
    trips = trips.filter((_, idx) => !selectedIndices.has(idx));
    closeModal();

    const saved = saveTrips();
    updateCount();

    if (viewDate === null) {
      showAll();
    } else {
      showDate(viewDate);
    }

    if (saved) {
      setMessage(`${count} سفر حذف شد`);
    } else {
      setMessage("خطا در ذخیره‌سازی اطلاعات", true);
    }
  }

  async function shareOrCopyText(text, title) {
    if (navigator.share) {
      try {
        await navigator.share({ title: title, text: text });
        setMessage("گزارش آماده ذخیره در نوت شد");
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
      }
    }
    try {
      await navigator.clipboard.writeText(text);
      setMessage("متن گزارش کپی شد؛ در برنامه نوت Paste کنید");
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setMessage("متن گزارش کپی شد؛ در برنامه نوت Paste کنید");
    }
  }

  // خروجی جمع ماهانه به نوت
  async function exportMonthlyToNotes() {
    const months = getMonthlyData();
    const sortedMonths = Object.keys(months).sort().reverse();
    if (sortedMonths.length === 0) return;

    let text = "📊 گزارش جمع ماهانه سفرها\n━━━━━━━━━━━━━━━\n";
    let grand = 0;
    sortedMonths.forEach(ym => {
      const m = months[ym];
      grand += m.total;
      text += `🗓 ${getMonthLabel(ym)} (${m.count} سفر) ⬅️ جمع: ${money(m.total)}\n`;
      text += `   ▫️ اسنپ: ${money(m.snapp)} | سایت: ${money(m.site)} | مغازه: ${money(m.shop)}\n`;
      text += "───────────────\n";
    });
    text += `💰 جمع کل تمام ماه‌ها: ${money(grand)}`;
    closeMoreModal();
    await shareOrCopyText(text, "گزارش ماهانه سفرها");
  }

  // خروجی سفرها به نوت
  async function exportToNotes() {
    if (trips.length === 0) {
      setMessage("اطلاعاتی برای خروجی گرفتن وجود ندارد", true);
      return;
    }

    let text = "";

    if (currentMode === 'daily') {
      const days = {};
      trips.forEach(t => {
        const d = normDate(t.date);
        if (!days[d]) days[d] = [0, 0];
        days[d][0] += 1;
        days[d][1] += t.cost;
      });
      const sortedDates = Object.keys(days).sort().reverse();
      let grand = 0;
      text += "📊 گزارش جمع روزانه سفرها\n━━━━━━━━━━━━━━━\n";
      sortedDates.forEach(d => {
        const [count, total] = days[d];
        grand += total;
        text += `📅 تاریخ: ${d} | تعداد: ${count} سفر | جمع: ${money(total)}\n`;
      });
      text += "━━━━━━━━━━━━━━━\n";
      text += `💰 جمع کل همه روزها: ${money(grand)} (${sortedDates.length} روز)`;
    } else {
      let listToExport = [];
      let title = "";

      if (selectedIndices.size > 0) {
        listToExport = trips.filter((_, idx) => selectedIndices.has(idx));
        title = `📋 گزارش سفرهای انتخاب‌شده (${listToExport.length} مورد)`;
      } else if (viewDate !== null) {
        listToExport = trips.filter(t => normDate(t.date) === viewDate);
        title = `📋 گزارش سفرهای تاریخ ${viewDate}`;
      } else {
        listToExport = trips;
        title = `📋 گزارش کل سفرها (${listToExport.length} مورد)`;
      }

      if (listToExport.length === 0) {
        setMessage("موردی برای خروجی گرفتن وجود ندارد", true);
        return;
      }

      let total = 0;
      text += title + "\n━━━━━━━━━━━━━━━\n";
      listToExport.forEach((t, i) => {
        total += t.cost;
        const src = t.source || "اسنپ";
        text += `${i + 1}. راننده: ${t.name} | نوع: ${src} | تاریخ: ${normDate(t.date)} | فاکتور: ${toEnglishDigits(t.invoice)} | هزینه: ${money(t.cost)}\n`;
      });
      text += "━━━━━━━━━━━━━━━\n";
      text += `💰 جمع کل هزینه: ${money(total)}`;
    }

    await shareOrCopyText(text, "گزارش سفرها");
  }

  // راه‌اندازی اولیه
  loadTrips();
  updateCount();
  showAll();
</script>
</body>
</html>
